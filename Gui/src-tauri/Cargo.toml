[package]
name = "lunq-debloater-gui"
version = "1.10.0"
description = "LunqDebloater window"
edition = "2021"
publish = false

[[bin]]
name = "LunqDebloater"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# Небольшой exe: окно только показывает прогресс, скорость кода в нём не важна.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
