<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LunqDebloater</title>
  <link rel="stylesheet" href="style.css">
  <script src="strings.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="logo.svg" alt="" width="22" height="22">
      <span>LunqDebloater</span>
      <span id="version" class="muted"></span>
    </div>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="ru">RU</button>
      <button type="button" data-lang="en">EN</button>
    </div>
  </header>

  <!-- Экран установки: LunqDebloater.exe скачали без скрипта. -->
  <section id="install" class="screen hidden">
    <div class="scroll">
      <div class="card hero">
        <h1 id="installTitle"></h1>
        <p id="installText" class="muted"></p>
        <div class="row">
          <div id="installPath" class="path"></div>
          <button type="button" id="pickInstall" class="btn subtle" data-t="common.folder"></button>
        </div>
        <div id="installState" class="state hidden"></div>
      </div>
      <details id="installDetails" class="card hidden">
        <summary data-t="prog.details"></summary>
        <pre id="installLog"></pre>
      </details>
    </div>
    <footer class="actions">
      <div class="muted small" data-t="install.hint"></div>
      <button type="button" id="installGo" class="btn primary"></button>
    </footer>
  </section>

  <!-- Экран 1: что собрать. Одна страница сверху вниз, кнопка сборки всегда видна внизу. -->
  <section id="setup" class="screen">
    <div class="scroll">
      <div id="fatal" class="card alert hidden"></div>

      <div class="card">
        <h2><span class="num">1</span><span data-t="iso.title"></span></h2>
        <div class="row">
          <button type="button" id="pickIso" class="btn"></button>
          <div id="isoPath" class="path"></div>
        </div>
        <div id="editionRow" class="field hidden">
          <label for="edition" data-t="iso.edition"></label>
          <select id="edition"></select>
        </div>
        <div id="isoState" class="state hidden"></div>
      </div>

      <div class="card">
        <h2><span class="num">2</span><span data-t="cat.title"></span></h2>
        <p id="profileText" class="muted small"></p>
        <div id="categories" class="list"></div>
      </div>

      <div class="card">
        <h2><span class="num">3</span><span data-t="out.title"></span></h2>
        <div class="row">
          <div id="outPath" class="path"></div>
          <button type="button" id="pickOut" class="btn subtle" data-t="out.change"></button>
        </div>
        <div id="setupOptions" class="list"></div>
      </div>

      <details id="more" class="card more">
        <summary data-t="more.title"></summary>
        <div id="moreOptions" class="list"></div>
        <div class="field">
          <label for="label" data-t="more.label"></label>
          <input id="label" type="text" maxlength="32" spellcheck="false">
        </div>
        <div class="field">
          <label for="workDir" data-t="more.workDir"></label>
          <div class="row">
            <input id="workDir" type="text" spellcheck="false">
            <button type="button" id="pickWorkDir" class="btn subtle" data-t="common.choose"></button>
          </div>
          <div class="muted small" data-t="more.workDirHint"></div>
        </div>
      </details>
    </div>
    <footer class="actions">
      <div id="setupHint" class="muted small"></div>
      <button type="button" id="start" class="btn primary" data-t="start" disabled></button>
    </footer>
  </section>

  <!-- Экран 2: сборка идёт. -->
  <section id="progress" class="screen hidden">
    <div class="scroll">
      <div class="card hero">
        <div id="progStep" class="eyebrow"></div>
        <h1 id="progTitle"></h1>
        <div id="progHint" class="muted"></div>
        <div class="bar"><div id="progBar"></div></div>
        <div class="row between muted small">
          <span id="progElapsed"></span>
          <span id="progWarn"></span>
        </div>
      </div>
      <p class="note" data-t="prog.dontClose"></p>
      <div class="card">
        <ol id="stepList" class="steps"></ol>
      </div>
      <details class="card">
        <summary data-t="prog.details"></summary>
        <pre id="log"></pre>
      </details>
    </div>
    <footer class="actions">
      <div></div>
      <button type="button" id="progLog" class="btn subtle" data-t="common.openLog" disabled></button>
    </footer>
  </section>

  <!-- Экран 3: итог. -->
  <section id="finish" class="screen hidden">
    <div class="scroll">
      <div class="card hero center">
        <div id="finIcon" class="big-icon"></div>
        <h1 id="finTitle"></h1>
        <p id="finText" class="muted"></p>
        <div id="finPath" class="path center hidden"></div>
        <div class="row center wrap">
          <button type="button" id="finShow" class="btn primary hidden" data-t="fin.show"></button>
          <button type="button" id="finLog" class="btn subtle hidden" data-t="common.openLog"></button>
          <button type="button" id="finReport" class="btn subtle hidden" data-t="fin.report"></button>
        </div>
        <p id="finReportHint" class="muted small hidden" data-t="fin.reportHint"></p>
      </div>
      <div id="finNext" class="card hidden"></div>
      <div id="finChecks" class="card hidden"></div>
      <div id="finResults" class="card hidden"></div>
      <details id="finWarnings" class="card hidden">
        <summary id="finWarningsTitle"></summary>
        <ul id="finWarningsList" class="plain"></ul>
      </details>
      <details id="finDetails" class="card hidden">
        <summary data-t="prog.details"></summary>
        <pre id="finStderr"></pre>
      </details>
    </div>
    <footer class="actions">
      <div></div>
      <button type="button" id="again" class="btn primary" data-t="fin.again"></button>
    </footer>
  </section>
</body>
</html>
