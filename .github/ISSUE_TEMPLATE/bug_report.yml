name: Ошибка / Bug report
description: Что-то работает не так / Something does not work as it should
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Спасибо, что сообщаете об ошибке. Без лога разобраться почти невозможно: он лежит в папке `Logs` рядом со скриптом.
        Thank you for reporting a bug. Without the log it is almost impossible to find the cause: it is in the `Logs` folder next to the script.
  - type: input
    id: version
    attributes:
      label: Версия LunqDebloater / LunqDebloater version
      description: Видна в заголовке консоли, рядом с названием в окне LunqDebloater.exe, в начале лога и в итоге сборки / Shown in the console title, next to the name in the LunqDebloater.exe window, at the start of the log and in the build result
      placeholder: "1.x.y"
    validations:
      required: true
  - type: input
    id: host-windows
    attributes:
      label: Windows на компьютере, где идёт сборка / Windows on the computer that builds the ISO
      description: "Выпуск и сборка, например из `winver` / Edition and build, for example from `winver`"
      placeholder: "Windows 11 Pro 25H2, 26200.6584"
    validations:
      required: true
  - type: input
    id: iso
    attributes:
      label: ISO (редакция и сборка) / ISO (edition and build)
      description: Какой ISO и какую редакцию вы собирали / Which ISO and edition you built
      placeholder: "Win11_26H2_x64.iso, Windows 11 Pro, 26300.9457"
    validations:
      required: true
  - type: textarea
    id: parameters
    attributes:
      label: Как запускали / How you ran it
      description: Командная строка целиком, «пошаговый режим (Start.cmd)» или «окно LunqDebloater.exe» и что вы выбрали / The full command line, "step-by-step mode (Start.cmd)" or "the LunqDebloater.exe window", and what you chose
      placeholder: |
        .\LunqDebloater.ps1 -IsoPath D:\Win11_26H2.iso -Edition "Windows 11 Pro" -Unattend
      render: powershell
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Что случилось / What happened
      description: Что вы увидели, текст ошибки / What you saw, the error text
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что ожидалось / What you expected
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Лог / Log file
      description: |
        Перетащите сюда архив `LunqDebloater_<дата>_report.zip` из папки `Logs` (он появляется после ошибки сборки, в окне его показывает кнопка «Отчёт об ошибке») или оба файла последнего запуска: `LunqDebloater_<дата>.log` и `LunqDebloater_<дата>_dism.zip`. Ошибки после установки: `C:\Windows\Setup\Scripts\Lunq\FirstLogon.log`.
        Drag the archive `LunqDebloater_<date>_report.zip` from the `Logs` folder here (it appears after a failed build; in the window the "Bug report" button shows it) or both files of the last run: `LunqDebloater_<date>.log` and `LunqDebloater_<date>_dism.zip`. For problems after installation: `C:\Windows\Setup\Scripts\Lunq\FirstLogon.log`.
      placeholder: Перетащите файлы сюда / Drag the files here
    validations:
      required: true
  - type: checkboxes
    id: responsibility
    attributes:
      label: Ответственность / Disclaimer
      options:
        - label: Я прочитал(а) раздел «Ответственность» в README / I have read the "Disclaimer" section of the README
          required: true
