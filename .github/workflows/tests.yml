name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Новый пуш в ту же ветку или PR отменяет прогон, который ещё идёт: его результат уже не нужен.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    # Зависший шаг иначе держал бы раннер до шестичасового лимита GitHub.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Образ раннера обычно уже содержит модули: установка только при их отсутствии экономит
      # минуту-две. Верхняя граница версии не даёт новому выпуску сделать CI красным без изменений в коде.
      - name: Install PSScriptAnalyzer
        shell: powershell
        run: |
          $have = Get-Module -ListAvailable PSScriptAnalyzer | Where-Object { $_.Version -ge [version]'1.23.0' -and $_.Version -lt [version]'2.0' }
          if (-not $have) { Install-Module PSScriptAnalyzer -MinimumVersion 1.23.0 -MaximumVersion 1.99.99 -Scope CurrentUser -Force }
          Get-Module -ListAvailable PSScriptAnalyzer | Select-Object -First 1 Name, Version, ModuleBase | Format-List
      - name: Analyze
        shell: powershell
        run: |
          $settings = '.\PSScriptAnalyzerSettings.psd1'
          $results = @(Invoke-ScriptAnalyzer -Path .\LunqDebloater.ps1 -Settings $settings) +
            @(Invoke-ScriptAnalyzer -Path .\Install.ps1 -Settings $settings) +
            @(Invoke-ScriptAnalyzer -Path .\Modules -Recurse -Settings $settings)
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 250
          if ($results.Count -gt 0) { throw "PSScriptAnalyzer found $($results.Count) issue(s)" }

  test:
    name: Pester (${{ matrix.os }}, ${{ matrix.shell }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # powershell: Windows PowerShell 5.1, в котором скрипт работает на самом деле.
          - os: windows-latest
            shell: powershell
          # pwsh: PowerShell 7, чтобы тесты не зависели от версии.
          - os: windows-latest
            shell: pwsh
          # Linux: тесты обещают работать и там, а разделители путей ломаются только в нём.
          - os: ubuntu-latest
            shell: pwsh
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Pester
        run: |
          $have = Get-Module -ListAvailable Pester | Where-Object { $_.Version -ge [version]'5.5.0' -and $_.Version -lt [version]'6.0' }
          if (-not $have) { Install-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99 -Scope CurrentUser -Force -SkipPublisherCheck }
      - name: Run tests
        run: |
          Import-Module Pester -MinimumVersion 5.5.0 -MaximumVersion 5.99.99
          $config = New-PesterConfiguration
          $config.Run.Path = './Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'TestResults.xml'
          Invoke-Pester -Configuration $config
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-${{ matrix.os }}-${{ matrix.shell }}
          path: TestResults.xml
