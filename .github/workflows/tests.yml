name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  analyze:
    name: PSScriptAnalyzer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install PSScriptAnalyzer
        shell: powershell
        run: Install-Module PSScriptAnalyzer -MinimumVersion 1.23.0 -Scope CurrentUser -Force
      - name: Analyze
        shell: powershell
        run: |
          $settings = '.\PSScriptAnalyzerSettings.psd1'
          $results = @(Invoke-ScriptAnalyzer -Path .\LunqDebloater.ps1 -Settings $settings) +
            @(Invoke-ScriptAnalyzer -Path .\Modules -Recurse -Settings $settings)
          $results | Format-Table RuleName, Severity, ScriptName, Line, Message -AutoSize -Wrap | Out-String -Width 250
          if ($results.Count -gt 0) { throw "PSScriptAnalyzer found $($results.Count) issue(s)" }

  test:
    name: Pester (${{ matrix.shell }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # powershell: Windows PowerShell 5.1, в котором скрипт работает на самом деле.
        # pwsh: PowerShell 7, чтобы тесты не зависели от версии.
        shell: [powershell, pwsh]
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Pester
        run: Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Run tests
        run: |
          Import-Module Pester -MinimumVersion 5.5.0
          $config = New-PesterConfiguration
          $config.Run.Path = '.\Tests'
          $config.Run.Exit = $true
          $config.Output.Verbosity = 'Detailed'
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'TestResults.xml'
          Invoke-Pester -Configuration $config
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.shell }}
          path: TestResults.xml
